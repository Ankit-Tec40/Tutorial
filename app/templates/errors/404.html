{% extends "base.html" %}

{% block title %}Page Not Found (404) - AI Engineering Lab{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="card-custom p-5 mx-auto" style="max-width: 500px;">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold mb-2">Lesson or Page Not Found</h3>
    <p class="text-muted mb-4">The lesson, lab, or resource you were looking for does not exist or has been relocated.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary d-inline-flex align-items-center gap-2">
      <i class="bi bi-arrow-left"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
